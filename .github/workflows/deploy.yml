name: Deploy HPC Mail

on:
  push:
    branches: [main]
    paths:
      - apps/**
      - packages/**
      - .github/workflows/deploy.yml
      - scripts/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:
    inputs:
      migrations_applied:
        type: boolean
        default: false
        description: '迁移文件有变更时，仅在已单独执行并验证迁移后启用'

concurrency:
  group: hpc-mail-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
  D1_NAME: hpc-cloud-mail-db

jobs:
  deploy:
    # 一键部署克隆出的仓库不配 Variables，自动跳过本工作流（不产生失败标记）
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验普通发布参数
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo '::error::缺 CLOUDFLARE_API_TOKEN'; exit 1; }
          echo "$CLOUDFLARE_ACCOUNT_ID" | grep -qE '^[a-f0-9]{32}$'
          echo "$KV_NAMESPACE_ID" | grep -qE '^[a-f0-9]{32}$'
          echo "$D1_DATABASE_ID" | grep -qE '^[a-f0-9-]{36}$'
          echo "$CUSTOM_DOMAIN" | grep -qE '^[a-z0-9]+([.-][a-z0-9]+)+$'

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: shared 测试与类型检查
        run: |
          pnpm --filter @hpc-mail/shared test
          pnpm --filter @hpc-mail/shared typecheck

      - name: web 测试、类型检查与构建
        run: |
          pnpm --filter @hpc-mail/web test
          pnpm --filter @hpc-mail/web typecheck
          pnpm --filter @hpc-mail/web build

      - name: 禁止 sourcemap 进产物
        run: |
          maps=$(find apps/web/dist -name '*.map' | wc -l)
          [ "$maps" = "0" ] || { echo '::error::产物包含 sourcemap'; exit 1; }

      - name: 拷贝前端产物进 worker
        run: pnpm --filter @hpc-mail/worker build:assets

      - name: worker 测试与类型检查
        run: |
          pnpm --filter @hpc-mail/worker test
          pnpm --filter @hpc-mail/worker typecheck

      - name: 依赖安全审计
        run: pnpm audit --prod --audit-level high

      - name: 注入 Cloudflare 资源配置
        working-directory: apps/worker
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          BUILD_SHA: ${{ github.sha }}
          PLACEMENT_REGION: ${{ vars.PLACEMENT_REGION }}
        run: |
          set -euo pipefail
          sed -i \
            -e "s/__D1_DATABASE_ID__/${D1_DATABASE_ID}/" \
            -e "s/__KV_NAMESPACE_ID__/${KV_NAMESPACE_ID}/" \
            -e "s|site_origin = \"https://hpc.email\"|site_origin = \"https://${CUSTOM_DOMAIN}\"|" \
            -e "s|build_sha = \"local\"|build_sha = \"${BUILD_SHA}\"|" \
            -e "s|^workers_dev = true$|workers_dev = false\npreview_urls = false\nroutes = [ { pattern = \"${CUSTOM_DOMAIN}\", custom_domain = true } ]|" \
            wrangler.toml
          grep -qE '__[A-Z0-9_]+__' wrangler.toml && { echo '::error::wrangler.toml 仍有未注入占位符'; exit 1; } || true
          grep -q 'workers_dev = false' wrangler.toml || { echo '::error::routes/workers_dev 注入失败'; exit 1; }
          # 可选 placement：把 Worker 固定到 D1 主库附近（如 aws:ap-southeast-1）；模板不写死，未设置则跳过
          if [ -n "$PLACEMENT_REGION" ]; then
            echo "$PLACEMENT_REGION" | grep -qE '^[a-z0-9]+:[a-z0-9-]+$' || { echo "::error::PLACEMENT_REGION 格式非法（应形如 aws:ap-southeast-1）"; exit 1; }
            grep -qx '\[placement\]' wrangler.toml && { echo '::error::wrangler.toml 已存在 [placement] 段'; exit 1; } || true
            printf '\n[placement]\nregion = "%s"\n' "$PLACEMENT_REGION" >> wrangler.toml
            grep -qx '\[placement\]' wrangler.toml && grep -qx "region = \"$PLACEMENT_REGION\"" wrangler.toml || { echo '::error::placement 注入失败'; exit 1; }
            echo "placement region: $PLACEMENT_REGION"
          else
            echo '::notice::未设置 PLACEMENT_REGION，跳过 placement 注入'
          fi
          # 现存哈希资源由边缘直出、不绕到 placement 区域；缺失文件仍经 Worker 返回 404（build:assets 已在前面执行）
          node scripts/inject-asset-routes.mjs
          rules=$(grep -E '^run_worker_first' wrangler.toml | grep -o '"[^"]*"' | wc -l)
          excluded=$(grep -E '^run_worker_first' wrangler.toml | grep -o '"!/assets/[^"]*"' | wc -l)
          echo "run_worker_first 共 $rules 条，静态资源排除 $excluded 条"
          [ "$rules" -le 100 ] || { echo '::error::run_worker_first 超过 Cloudflare 100 条上限'; exit 1; }
          grep -E '^run_worker_first' wrangler.toml | grep -q '"/assets/\*"' || { echo '::error::run_worker_first 缺少 /assets/* 兜底规则'; exit 1; }

      - name: 检查现有部署的迁移边界
        env:
          BASE_URL: https://${{ vars.CUSTOM_DOMAIN }}
          BUILD_SHA: ${{ github.sha }}
          MIGRATIONS_APPLIED: ${{ github.event_name == 'workflow_dispatch' && inputs.migrations_applied }}
        run: node scripts/check-production-migrations.mjs

      - name: 部署预演（dry-run）
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --dry-run

      - name: 部署 Worker
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --keep-vars

      - name: 等待新版本全球生效
        env:
          BUILD_SHA: ${{ github.sha }}
          BASE_URL: https://${{ vars.CUSTOM_DOMAIN }}
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            if curl -sS -D /tmp/hpc-config.headers "$BASE_URL/api/config" | jq -e '.data.registrationMode' >/dev/null 2>&1 && tr -d '\r' < /tmp/hpc-config.headers | grep -qi "^x-hpc-build: $BUILD_SHA$"; then
              echo "新版本已生效（第 $i 次探测）"
              exit 0
            fi
            echo "等待部署传播…（$i/24）"
            sleep 10
          done
          echo '::error::240s 内新版本未生效'
          exit 1

      - name: 公开边界冒烟
        env:
          BASE_URL: https://${{ vars.CUSTOM_DOMAIN }}
        run: node scripts/check-production-boundaries.mjs
